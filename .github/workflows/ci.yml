name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify:roster-feasibility
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Negative control retain ADP during reset
        shell: pwsh
        run: |
          $path = "apps/api/src/index.ts"
          $source = Get-Content -LiteralPath $path -Raw
          $clear = "      () => adpImportStore.clearAll(),"
          if (-not $source.Contains($clear)) { throw "ADP negative-control target was not found." }
          Set-Content -LiteralPath $path -Value $source.Replace($clear, "")
      - run: npm run build:assets -w @sleeper-draft-assistant/desktop
      - run: node node_modules/electron-builder/cli.js --projectDir apps/desktop --win nsis portable --publish never
      - name: Record artifact integrity before smoke
        id: candidate-integrity
        shell: pwsh
        run: ./scripts/check-candidate-artifacts.ps1 -Record
      - name: Smoke test packaged API and desktop startup
        shell: pwsh
        run: ./scripts/smoke-packaged-windows.ps1
      - name: Smoke test installer upgrade, reset, redaction, and portable executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_BASELINE_TAG: ${{ vars.SMOKE_BASELINE_TAG }}
        run: ./scripts/smoke-installer-windows.ps1
      - name: Verify artifact integrity after smoke
        shell: pwsh
        env:
          SMOKE_CANDIDATE_HASHES: ${{ steps.candidate-integrity.outputs.hashes }}
        run: ./scripts/check-candidate-artifacts.ps1
      - name: Record candidate checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/out-builder -File -Filter "*.exe" |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -Encoding ascii apps/desktop/out-builder/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-candidate
          path: |
            apps/desktop/out-builder/*.exe
            apps/desktop/out-builder/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
