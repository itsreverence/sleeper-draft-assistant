name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/candidate-artifacts.test.mjs
      - run: pwsh -NoProfile -File scripts/publish-release.test.ps1
      - run: npm run check
      - run: npm test
      - run: npm run verify:roster-feasibility
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:assets -w @sleeper-draft-assistant/desktop
      - run: node node_modules/electron-builder/cli.js --projectDir apps/desktop --win nsis portable --publish never
      - name: Record artifact integrity before smoke
        run: node scripts/candidate-artifacts.mjs record
      - name: Upload candidate before executing smoke binaries
        id: candidate-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-candidate
          path: build/windows-candidate/files/
          if-no-files-found: error
          retention-days: 7
      - name: Log candidate identity before executing smoke binaries
        shell: pwsh
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate-artifacts.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate-artifacts.outputs.artifact-digest }}
        run: |
          Write-Host "Pre-smoke windows-candidate artifact ID: $env:CANDIDATE_ARTIFACT_ID"
          Write-Host "Pre-smoke windows-candidate ZIP SHA-256: $env:CANDIDATE_ARTIFACT_DIGEST"
      - name: Smoke test packaged API and desktop startup
        shell: pwsh
        run: ./scripts/smoke-packaged-windows.ps1
      - name: Smoke test installer upgrade, reset, redaction, and portable executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_BASELINE_TAG: ${{ vars.SMOKE_BASELINE_TAG }}
        run: ./scripts/smoke-installer-windows.ps1
