name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run desktop:package
      - name: Verify unpacked executable
        shell: pwsh
        run: |
          $exe = "apps/desktop/out-builder/win-unpacked/Sleeper Draft Assistant.exe"
          if (-not (Test-Path $exe)) { throw "Missing packaged executable: $exe" }
