name: Release

on:
  push:
    branches: [ci/windows-upgrade-reset-smoke]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      release-artifact-id: ${{ steps.release-artifacts.outputs.artifact-id }}
      unpacked-artifact-id: ${{ steps.unpacked-artifacts.outputs.artifact-id }}
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version. Expected $expectedTag."
          }
          $workspaceManifests = Get-ChildItem apps, packages -Directory |
            ForEach-Object { Get-Item (Join-Path $_.FullName "package.json") }
          foreach ($manifest in $workspaceManifests) {
            $workspaceVersion = (Get-Content $manifest.FullName | ConvertFrom-Json).version
            if ($workspaceVersion -ne $version) {
              throw "$($manifest.FullName) has version $workspaceVersion; expected $version."
            }
          }

      - run: npm ci
      - run: node --test scripts/candidate-artifacts.test.mjs
      - run: pwsh -NoProfile -File scripts/publish-release.test.ps1
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run desktop:make -- -- --publish never
        shell: bash
      - name: Record and stage release artifacts
        run: node scripts/candidate-artifacts.mjs record --release
      - name: Upload build artifacts and hash manifest
        id: release-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unpacked application for smoke
        id: unpacked-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-unpacked
          path: apps/desktop/out-builder/win-unpacked/
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          merge-multiple: true
          path: build/windows-candidate
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.unpacked-artifact-id }}
          merge-multiple: true
          path: apps/desktop/out-builder/win-unpacked
      - name: Smoke test packaged API and desktop startup
        shell: pwsh
        run: ./scripts/smoke-packaged-windows.ps1
      - name: Smoke test installer upgrade, reset, redaction, and portable executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_BASELINE_TAG: ${{ vars.SMOKE_BASELINE_TAG }}
        run: ./scripts/smoke-installer-windows.ps1 -OutputDirectory build/windows-candidate/files

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          merge-multiple: true
          path: build/windows-candidate
      - name: Verify build hashes and create release checksums
        run: node scripts/candidate-artifacts.mjs verify --release
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1

  dry-run-publish:
    if: github.ref == 'refs/heads/ci/windows-upgrade-reset-smoke'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          merge-multiple: true
          path: build/windows-candidate
      - name: Verify build hashes and create release checksums
        run: node scripts/candidate-artifacts.mjs verify --release
      - name: Dry run GitHub release publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -Tag "rehearsal-$env:GITHUB_SHA" -DryRun
