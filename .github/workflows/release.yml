name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version. Expected $expectedTag."
          }
          $workspaceManifests = Get-ChildItem apps, packages -Directory |
            ForEach-Object { Get-Item (Join-Path $_.FullName "package.json") }
          foreach ($manifest in $workspaceManifests) {
            $workspaceVersion = (Get-Content $manifest.FullName | ConvertFrom-Json).version
            if ($workspaceVersion -ne $version) {
              throw "$($manifest.FullName) has version $workspaceVersion; expected $version."
            }
          }

      - run: npm ci
      - run: node --test scripts/candidate-artifacts.test.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run desktop:make -- -- --publish never
      - name: Record and stage release artifacts
        run: node scripts/candidate-artifacts.mjs record --release
      - name: Upload build artifacts and hash manifest
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unpacked application for smoke
        uses: actions/upload-artifact@v7
        with:
          name: windows-unpacked
          path: apps/desktop/out-builder/win-unpacked/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: build/windows-candidate
      - uses: actions/download-artifact@v8
        with:
          name: windows-unpacked
          path: apps/desktop/out-builder/win-unpacked
      - name: Smoke test packaged API and desktop startup
        shell: pwsh
        run: ./scripts/smoke-packaged-windows.ps1
      - name: Smoke test installer upgrade, reset, redaction, and portable executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_BASELINE_TAG: ${{ vars.SMOKE_BASELINE_TAG }}
        run: ./scripts/smoke-installer-windows.ps1 -OutputDirectory build/windows-candidate/files

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: build/windows-candidate
      - name: Verify build hashes and create release checksums
        run: node scripts/candidate-artifacts.mjs verify --release
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $output = Resolve-Path "build/windows-candidate/files"
          $manifest = Get-Content build/windows-candidate/candidate-hashes.json | ConvertFrom-Json
          $artifactPaths = @($manifest.artifacts | ForEach-Object { Join-Path $output $_.name })
          $artifactPaths += Join-Path $output "SHA256SUMS.txt"
          $isPrerelease = $env:GITHUB_REF_NAME.Contains("-").ToString().ToLowerInvariant()
          $notesPath = "docs/releases/$($env:GITHUB_REF_NAME.TrimStart('v')).md"
          $notesArgs = @()
          if (Test-Path $notesPath) {
            $notesArgs = @("--notes-file", $notesPath)
          }

          & gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:GITHUB_REF_NAME @artifactPaths --clobber
          } else {
            & gh release create $env:GITHUB_REF_NAME @artifactPaths `
              --title "Sleeper Draft Assistant $env:GITHUB_REF_NAME" `
              --generate-notes `
              "--prerelease=$isPrerelease" `
              --verify-tag @notesArgs
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed."
          }
